function AlleAufgabenTab({ tasks, projects, projectById, categoryById, filterProject, setFilterProject, hideDone, setHideDone, updateTask, deleteTask, addTask }) {
  const [showQuickAdd, setShowQuickAdd] = useState(false);
  const [search, setSearch] = useState("");

  const filtered = useMemo(() => {
    let list = tasks;
    if (filterProject !== "alle") list = list.filter((t) => t.projectId === filterProject);
    if (hideDone) list = list.filter((t) => !t.done);
    const q = search.trim().toLowerCase();
    if (q) {
      list = list.filter((t) => {
        const project = projectById[t.projectId];
        const haystack = [
          t.title,
          t.notes,
          fmtDeadline(t.deadline),
          t.deadline,
          fmtEffort(t.estimatedHours),
          String(t.priority),
          TASK_TYPES[t.type]?.label,
          project?.name,
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
        return haystack.includes(q);
      });
    }
    return list.slice().sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      const ad = a.deadline || "9999-99-99";
      const bd = b.deadline || "9999-99-99";
      if (ad !== bd) return ad < bd ? -1 : 1;
      return b.priority - a.priority;
    });
  }, [tasks, filterProject, hideDone, search, projectById]);

  return (
    <div className="fade-in">
      <input
        value={search}
        onChange={(e) => setSearch(e.target.value)}
        placeholder="Suche in Titel, Notizen, Datum, Aufwand …"
        className="w-full text-sm rounded-lg px-3 py-2.5 mb-3"
        style={{ background: "#242C3E", border: "1px solid #38415A", color: "#EDEAE2" }}
      />
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <select
          value={filterProject}
          onChange={(e) => setFilterProject(e.target.value)}
          className="mono text-xs rounded-lg px-2.5 py-2"
          style={{ background: "#242C3E", border: "1px solid #38415A", color: "#EDEAE2" }}
        >
          <option value="alle">Alle Listen</option>
          {projects.map((p) => (
            <option key={p.id} value={p.id}>
              {p.name}
              {p.isArchived ? " (archiviert)" : ""}
            </option>
          ))}
        </select>
        <label className="flex items-center gap-2 mono text-xs cursor-pointer" style={{ color: "#6E7A94" }}>
          <input type="checkbox" checked={hideDone} onChange={(e) => setHideDone(e.target.checked)} style={{ accentColor: "#E8B54B" }} />
          Erledigte ausblenden
        </label>
        <button
          onClick={() => setShowQuickAdd((v) => !v)}
          className="sg text-xs rounded-lg px-3 py-2 ml-auto"
          style={{ background: showQuickAdd ? "#38415A" : "#E8B54B", color: showQuickAdd ? "#EDEAE2" : "#1B2130", fontWeight: 600, border: "none" }}
        >
          {showQuickAdd ? "Schließen" : "+ Aufgabe"}
        </button>
      </div>

      {showQuickAdd && <QuickAddForm projects={projects} onAdd={(t) => { addTask(t); setShowQuickAdd(false); }} />}

      <div className="flex flex-col gap-2">
        {filtered.length === 0 && (
          <div className="rounded-xl px-4 py-8 text-center text-sm" style={{ background: "#242C3E44", color: "#6E7A94", border: "1px dashed #38415A" }}>
            Keine Aufgaben gefunden.
          </div>
        )}
        {filtered.map((t) => (
          <TaskRow key={t.id} task={t} project={projectById[t.projectId]} categoryById={categoryById} projects={projects} onToggle={() => updateTask(t.id, { done: !t.done })} onUpdate={(patch) => updateTask(t.id, patch)} onDelete={() => deleteTask(t.id)} />
        ))}
      </div>
    </div>
  );
}

function QuickAddForm({ projects, onAdd }) {
  const [title, setTitle] = useState("");
  const [projectId, setProjectId] = useState(activeProjects(projects)[0]?.id || "betrieblich");
  const [priority, setPriority] = useState(5);
  const [estimatedHours, setEstimatedHours] = useState("");
  const [deadline, setDeadline] = useState("");
  const [notes, setNotes] = useState("");
  const [taskType, setTaskType] = useState("allgemein");

  function submit() {
    if (!title.trim()) return;
    onAdd({ title: title.trim(), projectId, priority, estimatedHours: estimatedHours ? parseFloat(estimatedHours) : null, deadline: deadline || null, notes, type: taskType });
    setTitle("");
    setNotes("");
    setDeadline("");
    setPriority(5);
    setEstimatedHours("");
    setTaskType("allgemein");
  }

  return (
    <div className="rounded-xl p-3 mb-4 flex flex-col gap-2 fade-in" style={{ background: "#242C3E" }}>
      <input
        value={title}
        onChange={(e) => setTitle(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
        placeholder="Titel"
        className="w-full text-sm rounded-lg px-2.5 py-2"
        style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}
        autoFocus
      />
      <textarea
        value={notes}
        onChange={(e) => setNotes(e.target.value)}
        placeholder="Notizen (optional)"
        rows={2}
        className="w-full text-xs rounded-lg px-2.5 py-2"
        style={{ background: "#1B2130", border: "1px solid #38415A", color: "#9AA3B5", resize: "vertical" }}
      />
      <div className="flex flex-wrap gap-2">
        <select value={taskType} onChange={(e) => setTaskType(e.target.value)} className="mono text-[11px] rounded px-2 py-1.5" style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}>
          {Object.entries(TASK_TYPES).map(([id, meta]) => (
            <option key={id} value={id}>
              {meta.icon} {meta.label}
            </option>
          ))}
        </select>
        <select value={projectId} onChange={(e) => setProjectId(e.target.value)} className="mono text-[11px] rounded px-2 py-1.5" style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}>
          {activeProjects(projects, projectId).map((p) => (
            <option key={p.id} value={p.id}>
              {p.name}
            </option>
          ))}
        </select>
        <select value={priority} onChange={(e) => setPriority(parseInt(e.target.value, 10))} className="mono text-xs rounded px-2 py-1.5" style={{ background: "#1B2130", border: "1px solid #38415A", color: priorityColor(priority) }}>
          {Array.from({ length: 10 }, (_, i) => i + 1).map((n) => (
            <option key={n} value={n}>
              {n}
            </option>
          ))}
        </select>
        <select value={estimatedHours} onChange={(e) => setEstimatedHours(e.target.value)} className="mono text-xs rounded px-2 py-1.5" style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}>
          <option value="">Aufwand –</option>
          {EFFORT_OPTIONS.map((h) => (
            <option key={h} value={h}>
              {fmtEffort(h)}
            </option>
          ))}
        </select>
        <input type="date" value={deadline} onChange={(e) => setDeadline(e.target.value)} className="mono text-xs rounded px-2 py-1.5" style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }} />
        <button type="button" onClick={submit} className="sg text-xs rounded-lg px-3 py-1.5 ml-auto" style={{ background: "#E8B54B", color: "#1B2130", fontWeight: 600, border: "none" }}>
          Hinzufügen
        </button>
      </div>
    </div>
  );
}

function TaskRow({ task, project, categoryById, projects, onToggle, onUpdate, onDelete }) {
  const [editing, setEditing] = useState(false);
  const [confirmingDelete, setConfirmingDelete] = useState(false);
  const [draft, setDraft] = useState(task);
  const dLeft = daysUntil(task.deadline);
  const overdue = dLeft !== null && dLeft < 0 && !task.done;

  function openEdit() {
    setDraft({ ...task, deadline: task.deadline || "" });
    setConfirmingDelete(false);
    setEditing(true);
  }

  function closeEdit() {
    setEditing(false);
    setConfirmingDelete(false);
  }

  function saveEdit() {
    onUpdate({
      title: draft.title.trim() || task.title,
      notes: draft.notes,
      priority: Math.min(10, Math.max(1, parseInt(draft.priority, 10) || 1)),
      estimatedHours: draft.estimatedHours ? parseFloat(draft.estimatedHours) : null,
      deadline: draft.deadline || null,
      projectId: draft.projectId,
      type: draft.type,
    });
    setEditing(false);
  }

  if (editing) {
    return (
      <div className="fade-in rounded-xl p-3" style={{ background: "#242C3E", border: `1px solid ${priorityColor(draft.priority)}55` }}>
        <input
          value={draft.title}
          onChange={(e) => setDraft({ ...draft, title: e.target.value })}
          className="w-full sg text-sm rounded-lg px-2.5 py-2 mb-2"
          style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2", fontWeight: 600 }}
          autoFocus
        />
        <textarea
          value={draft.notes}
          onChange={(e) => setDraft({ ...draft, notes: e.target.value })}
          placeholder="Notizen …"
          rows={2}
          className="w-full text-xs rounded-lg px-2.5 py-2 mb-2"
          style={{ background: "#1B2130", border: "1px solid #38415A", color: "#9AA3B5", resize: "vertical" }}
        />
        <div className="flex flex-wrap gap-2 mb-3">
          <select value={draft.type} onChange={(e) => setDraft({ ...draft, type: e.target.value })} className="mono text-[11px] rounded px-2 py-1" style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}>
            {Object.entries(TASK_TYPES).map(([id, meta]) => (
              <option key={id} value={id}>
                {meta.icon} {meta.label}
              </option>
            ))}
          </select>
          <select
            value={draft.priority}
            onChange={(e) => setDraft({ ...draft, priority: e.target.value })}
            className="mono text-xs rounded px-2 py-1"
            style={{ background: "#1B2130", border: "1px solid #38415A", color: priorityColor(draft.priority) }}
          >
            {Array.from({ length: 10 }, (_, i) => i + 1).map((n) => (
              <option key={n} value={n}>
                {n}
              </option>
            ))}
          </select>
          <select
            value={draft.estimatedHours || ""}
            onChange={(e) => setDraft({ ...draft, estimatedHours: e.target.value })}
            className="mono text-xs rounded px-2 py-1"
            style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}
          >
            <option value="">Aufwand –</option>
            {EFFORT_OPTIONS.map((h) => (
              <option key={h} value={h}>
                {fmtEffort(h)}
              </option>
            ))}
          </select>
          <input
            type="date"
            value={draft.deadline || ""}
            onChange={(e) => setDraft({ ...draft, deadline: e.target.value })}
            className="mono text-xs rounded px-2 py-1"
            style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}
          />
          <select value={draft.projectId} onChange={(e) => setDraft({ ...draft, projectId: e.target.value })} className="mono text-[11px] rounded px-2 py-1" style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}>
            {activeProjects(projects, draft.projectId).map((p) => (
              <option key={p.id} value={p.id}>
                {p.name}
                {p.isArchived ? " (archiviert)" : ""}
              </option>
            ))}
          </select>
        </div>
        <div className="flex items-center justify-between pt-2" style={{ borderTop: "1px solid #38415A" }}>
          {!confirmingDelete ? (
            <button onClick={() => setConfirmingDelete(true)} className="mono text-xs px-2 py-1.5 rounded-lg" style={{ color: "#E2704F", border: "none", background: "transparent" }}>
              Aufgabe löschen
            </button>
          ) : (
            <div className="flex gap-2">
              <button onClick={onDelete} className="mono text-xs px-2.5 py-1.5 rounded-lg" style={{ background: "#E2704F", color: "#1B2130", border: "none", fontWeight: 600 }}>
                Endgültig löschen
              </button>
              <button onClick={() => setConfirmingDelete(false)} className="mono text-xs px-2.5 py-1.5 rounded-lg" style={{ background: "#38415A", color: "#9AA3B5", border: "none" }}>
                Abbrechen
              </button>
            </div>
          )}
          <div className="flex gap-2">
            <button onClick={closeEdit} className="mono text-xs px-2.5 py-1.5 rounded-lg" style={{ color: "#6E7A94", border: "none", background: "transparent" }}>
              Abbrechen
            </button>
            <button onClick={saveEdit} className="sg text-xs px-3 py-1.5 rounded-lg" style={{ background: "#E8B54B", color: "#1B2130", fontWeight: 600, border: "none" }}>
              Speichern
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div
      onClick={openEdit}
      className="fade-in flex items-start gap-3 rounded-xl px-4 py-3"
      style={{ background: "#242C3E", borderLeft: `3px solid ${priorityColor(task.priority)}`, opacity: task.done ? 0.5 : 1, cursor: "pointer" }}
    >
      <button
        onClick={(e) => { e.stopPropagation(); onToggle(); }}
        className="flex-shrink-0 rounded-full flex items-center justify-center mt-0.5"
        style={{ width: 20, height: 20, border: `2px solid ${task.done ? "#6FBF8B" : "#4B5468"}`, background: task.done ? "#6FBF8B" : "transparent" }}
        aria-label="Erledigt umschalten"
      >
        {task.done && <span style={{ color: "#1B2130", fontSize: 12, lineHeight: 1 }}>✓</span>}
      </button>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 flex-wrap">
          <span className="text-sm" style={{ color: "#EDEAE2", textDecoration: task.done ? "line-through" : "none" }}>
            {TASK_TYPES[task.type]?.icon && <span className="mr-1.5">{TASK_TYPES[task.type].icon}</span>}
            {task.title}
          </span>
          {project && (
            <span className="mono text-[10px] px-1.5 py-0.5 rounded-full" style={{ background: `${categoryById[project.type]?.color || "#6E7A94"}22`, color: categoryById[project.type]?.color || "#6E7A94" }}>
              {project.name}
            </span>
          )}
        </div>
        {task.notes && (
          <p className="text-xs mt-1" style={{ color: "#6E7A94" }}>
            {task.notes}
          </p>
        )}
        <div className="flex items-center gap-3 mt-1.5">
          {task.deadline && (
            <span className="mono text-[11px]" style={{ color: overdue ? "#E2704F" : "#6E7A94" }}>
              {overdue ? "überfällig · " : ""}
              {fmtDeadline(task.deadline)}
            </span>
          )}
          <span className="mono text-[11px]" style={{ color: priorityColor(task.priority) }}>
            P{task.priority}
          </span>
          {task.estimatedHours ? (
            <span className="mono text-[11px]" style={{ color: "#6E7A94" }}>
              ⏱ {fmtEffort(task.estimatedHours)}
            </span>
          ) : null}
        </div>
      </div>
    </div>
  );
}

function ProjekteTab({
  projects,
  tasks,
  createProject,
  deleteProject,
  updateProject,
  archiveProject,
  unarchiveProject,
  moveProject,
  categories,
  onOpenProject,
}) {
  const [showForm, setShowForm] = useState(false);
  const [showArchive, setShowArchive] = useState(false);
  const [name, setName] = useState("");
  const [type, setType] = useState(categories[0]?.id || "");
  const [confirmingId, setConfirmingId] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState({ name: "", type: "" });

  const sortedCategories = useMemo(() => categories.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0)), [categories]);

  function startEditProject(p) {
    setEditDraft({ name: p.name, type: p.type });
    setEditingId(p.id);
    setConfirmingId(null);
  }

  function saveEditProject(p) {
    if (editDraft.name.trim()) {
      updateProject(p.id, { name: editDraft.name.trim(), type: editDraft.type });
    }
    setEditingId(null);
  }

  function submit() {
    if (!name.trim() || !type) return;
    createProject(name.trim(), type);
    setName("");
    setShowForm(false);
  }

  const grouped = useMemo(() => {
    const g = {};
    sortedCategories.forEach((c) => (g[c.id] = []));
    projects
      .filter((p) => !p.isArchived)
      .forEach((p) => {
        if (g[p.type]) g[p.type].push(p);
      });
    Object.values(g).forEach((list) => list.sort((a, b) => (a.order ?? 0) - (b.order ?? 0)));
    return g;
  }, [projects, sortedCategories]);

  const archived = useMemo(() => projects.filter((p) => p.isArchived), [projects]);

  return (
    <div className="fade-in">
      <div className="flex justify-end gap-2 mb-4">
        <button onClick={() => setShowForm((v) => !v)} className="sg text-xs rounded-lg px-3 py-2" style={{ background: showForm ? "#38415A" : "#E8B54B", color: showForm ? "#EDEAE2" : "#1B2130", fontWeight: 600, border: "none" }}>
          {showForm ? "Schließen" : "+ Neue Liste"}
        </button>
      </div>

      {showForm && (
        <div className="rounded-xl p-3 mb-5 flex flex-wrap gap-2 fade-in" style={{ background: "#242C3E" }}>
          <input
            value={name}
            onChange={(e) => setName(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
            placeholder="Listenname, z. B. Bauvorhaben Müller"
            className="flex-1 min-w-[180px] text-sm rounded-lg px-2.5 py-2"
            style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}
            autoFocus
          />
          <select value={type} onChange={(e) => setType(e.target.value)} className="mono text-xs rounded px-2" style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}>
            {sortedCategories.map((c) => (
              <option key={c.id} value={c.id}>
                {c.name}
              </option>
            ))}
          </select>
          <button type="button" onClick={submit} className="sg text-xs rounded-lg px-3 py-2" style={{ background: "#E8B54B", color: "#1B2130", fontWeight: 600, border: "none" }}>
            Anlegen
          </button>
        </div>
      )}

      {sortedCategories.map((cat, catIdx) => {
        const list = grouped[cat.id] || [];
        if (list.length === 0) return null;
        return (
          <div key={cat.id} className="mb-5">
            <h3 className="mono text-[11px] uppercase tracking-wide mb-2" style={{ color: "#6E7A94" }}>
              {cat.name}
            </h3>
            <div className="flex flex-col gap-2">
              {list.map((p, idx) => {
                const pTasks = tasks.filter((t) => t.projectId === p.id);
                const open = pTasks.filter((t) => !t.done).length;
                const isConfirming = confirmingId === p.id;
                const isEditing = editingId === p.id;
                return (
                  <div key={p.id} className="rounded-xl px-4 py-3" style={{ background: "#242C3E", borderLeft: `3px solid ${cat.color}` }}>
                    {isEditing ? (
                      <div className="fade-in flex flex-wrap gap-2 items-center">
                        <input
                          value={editDraft.name}
                          onChange={(e) => setEditDraft({ ...editDraft, name: e.target.value })}
                          className="flex-1 min-w-[140px] text-sm rounded-lg px-2.5 py-2"
                          style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}
                          autoFocus
                        />
                        <select value={editDraft.type} onChange={(e) => setEditDraft({ ...editDraft, type: e.target.value })} className="mono text-xs rounded px-2 py-2" style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}>
                          {sortedCategories.map((c) => (
                            <option key={c.id} value={c.id}>
                              {c.name}
                            </option>
                          ))}
                        </select>
                        <button onClick={() => setEditingId(null)} className="mono text-xs px-2.5 py-2 rounded-lg" style={{ color: "#6E7A94", border: "none", background: "transparent" }}>
                          Abbrechen
                        </button>
                        <button onClick={() => saveEditProject(p)} className="sg text-xs px-3 py-2 rounded-lg" style={{ background: "#E8B54B", color: "#1B2130", fontWeight: 600, border: "none" }}>
                          Speichern
                        </button>
                      </div>
                    ) : (
                      <div className="flex items-center gap-2">
                        <div className="flex flex-col gap-0.5 flex-shrink-0">
                          <button
                            onClick={() => moveProject(p.id, "up")}
                            disabled={idx === 0}
                            className="mono px-1"
                            style={{ color: idx === 0 ? "#38415A" : "#6E7A94", border: "none", background: "transparent", fontSize: 10, lineHeight: 1 }}
                            aria-label="Nach oben"
                          >
                            ▲
                          </button>
                          <button
                            onClick={() => moveProject(p.id, "down")}
                            disabled={idx === list.length - 1}
                            className="mono px-1"
                            style={{ color: idx === list.length - 1 ? "#38415A" : "#6E7A94", border: "none", background: "transparent", fontSize: 10, lineHeight: 1 }}
                            aria-label="Nach unten"
                          >
                            ▼
                          </button>
                        </div>
                        <button onClick={() => onOpenProject(p.id)} className="flex-1 text-left" style={{ border: "none", background: "transparent" }}>
                          <span className="sg text-sm" style={{ color: "#EDEAE2", fontWeight: 600 }}>
                            {p.name}
                          </span>
                          <span className="mono text-[11px] ml-2" style={{ color: "#6E7A94" }}>
                            {open} offen · {pTasks.length} gesamt
                          </span>
                        </button>
                        {!isConfirming && (
                          <button onClick={() => startEditProject(p)} className="mono text-xs px-1.5" style={{ color: "#4B5468", border: "none", background: "transparent" }} aria-label="Liste bearbeiten">
                            ✎
                          </button>
                        )}
                        {!isConfirming && (
                          <button onClick={() => archiveProject(p.id)} className="mono text-xs px-1.5" style={{ color: "#4B5468", border: "none", background: "transparent" }} aria-label="Liste archivieren">
                            🗄
                          </button>
                        )}
                        {!isConfirming && projects.length > 1 && (
                          <button onClick={() => setConfirmingId(p.id)} className="mono text-xs px-1.5" style={{ color: "#4B5468", border: "none", background: "transparent" }} aria-label="Liste löschen">
                            ✕
                          </button>
                        )}
                      </div>
                    )}
                    {isConfirming && (
                      <div className="fade-in mt-2 pt-2" style={{ borderTop: "1px solid #38415A" }}>
                        <p className="mono text-[11px] mb-2" style={{ color: "#E2704F" }}>
                          {pTasks.length > 0
                            ? `Liste löschen? ${pTasks.length} Aufgabe(n) werden in eine andere Liste verschoben.`
                            : "Liste wirklich löschen?"}
                        </p>
                        <div className="flex gap-2">
                          <button
                            onClick={() => { deleteProject(p.id); setConfirmingId(null); }}
                            className="mono text-[11px] px-3 py-1.5 rounded"
                            style={{ background: "#E2704F", color: "#1B2130", border: "none", fontWeight: 600 }}
                          >
                            Endgültig löschen
                          </button>
                          <button onClick={() => setConfirmingId(null)} className="mono text-[11px] px-3 py-1.5 rounded" style={{ background: "#38415A", color: "#9AA3B5", border: "none" }}>
                            Abbrechen
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      <div className="flex gap-2 mb-3">
        <button
          onClick={() => setShowArchive((v) => !v)}
          className="mono text-xs rounded-lg px-3 py-2"
          style={{ background: "transparent", border: "1px solid #38415A", color: "#6E7A94" }}
        >
          {showArchive ? "Archiv ausblenden" : `Archiv anzeigen (${archived.length})`}
        </button>
      </div>

      {showArchive && (
        <div className="fade-in">
          {archived.length === 0 ? (
            <p className="mono text-[11px]" style={{ color: "#4B5468" }}>
              Keine archivierten Listen.
            </p>
          ) : (
            <div className="flex flex-col gap-2">
              {archived.map((p) => {
                const pTasks = tasks.filter((t) => t.projectId === p.id);
                return (
                  <div key={p.id} className="flex items-center gap-3 rounded-xl px-4 py-3" style={{ background: "#242C3E44", border: "1px dashed #38415A" }}>
                    <div className="flex-1">
                      <span className="sg text-sm" style={{ color: "#9AA3B5", fontWeight: 600 }}>
                        {p.name}
                      </span>
                      <span className="mono text-[11px] ml-2" style={{ color: "#6E7A94" }}>
                        {pTasks.length} Aufgabe(n)
                      </span>
                    </div>
                    <button onClick={() => unarchiveProject(p.id)} className="sg text-xs px-3 py-1.5 rounded-lg" style={{ background: "#38415A", color: "#EDEAE2", border: "none", fontWeight: 600 }}>
                      Wiederherstellen
                    </button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function CategoryManager({ categories, projects, createCategory, renameCategory, deleteCategory, moveCategory }) {
  const [newName, setNewName] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState("");
  const [blockedId, setBlockedId] = useState(null);
  const [confirmingId, setConfirmingId] = useState(null);

  function submitNew() {
    if (!newName.trim()) return;
    createCategory(newName.trim());
    setNewName("");
  }

  function startEdit(c) {
    setEditName(c.name);
    setEditingId(c.id);
    setConfirmingId(null);
    setBlockedId(null);
  }

  function saveEdit(c) {
    if (editName.trim()) renameCategory(c.id, editName.trim());
    setEditingId(null);
  }

  function tryDelete(c) {
    const inUse = projects.some((p) => p.type === c.id);
    if (inUse) {
      setBlockedId(c.id);
      setConfirmingId(null);
      return;
    }
    setConfirmingId(c.id);
    setBlockedId(null);
  }

  function confirmDelete(c) {
    deleteCategory(c.id);
    setConfirmingId(null);
  }

  return (
    <div className="rounded-xl p-4 mb-5 fade-in" style={{ background: "#242C3E", border: "1px solid #38415A" }}>
      <h3 className="sg text-sm mb-3" style={{ color: "#EDEAE2", fontWeight: 600 }}>
        Kategorien
      </h3>
      <div className="flex flex-col gap-2 mb-3">
        {categories.map((c, idx) => {
          const count = projects.filter((p) => p.type === c.id).length;
          const isEditing = editingId === c.id;
          const isBlocked = blockedId === c.id;
          const isConfirming = confirmingId === c.id;
          return (
            <div key={c.id} className="rounded-lg px-3 py-2" style={{ background: "#1B2130" }}>
              {isEditing ? (
                <div className="flex items-center gap-2">
                  <input
                    value={editName}
                    onChange={(e) => setEditName(e.target.value)}
                    className="flex-1 text-sm rounded-lg px-2.5 py-1.5"
                    style={{ background: "#242C3E", border: "1px solid #38415A", color: "#EDEAE2" }}
                    autoFocus
                  />
                  <button onClick={() => setEditingId(null)} className="mono text-xs px-2 py-1.5 rounded-lg" style={{ color: "#6E7A94", border: "none", background: "transparent" }}>
                    Abbrechen
                  </button>
                  <button onClick={() => saveEdit(c)} className="sg text-xs px-2.5 py-1.5 rounded-lg" style={{ background: "#E8B54B", color: "#1B2130", fontWeight: 600, border: "none" }}>
                    Speichern
                  </button>
                </div>
              ) : (
                <div className="flex items-center gap-2">
                  <div className="flex flex-col gap-0.5 flex-shrink-0">
                    <button onClick={() => moveCategory(c.id, "up")} disabled={idx === 0} className="mono px-1" style={{ color: idx === 0 ? "#38415A" : "#6E7A94", border: "none", background: "transparent", fontSize: 10, lineHeight: 1 }} aria-label="Nach oben">
                      ▲
                    </button>
                    <button onClick={() => moveCategory(c.id, "down")} disabled={idx === categories.length - 1} className="mono px-1" style={{ color: idx === categories.length - 1 ? "#38415A" : "#6E7A94", border: "none", background: "transparent", fontSize: 10, lineHeight: 1 }} aria-label="Nach unten">
                      ▼
                    </button>
                  </div>
                  <span style={{ width: 10, height: 10, borderRadius: "50%", background: c.color, flexShrink: 0 }} />
                  <span className="text-sm flex-1" style={{ color: "#EDEAE2" }}>
                    {c.name}
                    <span className="mono text-[11px] ml-2" style={{ color: "#6E7A94" }}>
                      {count} Liste(n)
                    </span>
                  </span>
                  <button onClick={() => startEdit(c)} className="mono text-xs px-1.5" style={{ color: "#4B5468", border: "none", background: "transparent" }} aria-label="Kategorie umbenennen">
                    ✎
                  </button>
                  <button onClick={() => tryDelete(c)} className="mono text-xs px-1.5" style={{ color: "#4B5468", border: "none", background: "transparent" }} aria-label="Kategorie löschen">
                    ✕
                  </button>
                </div>
              )}
              {isBlocked && (
                <p className="mono text-[11px] mt-2" style={{ color: "#E2704F" }}>
                  Wird von {count} Liste(n) verwendet – kann erst gelöscht werden, wenn keine Liste mehr dieser Kategorie zugeordnet ist.
                </p>
              )}
              {isConfirming && (
                <div className="flex gap-2 mt-2">
                  <button onClick={() => confirmDelete(c)} className="mono text-[11px] px-3 py-1.5 rounded" style={{ background: "#E2704F", color: "#1B2130", border: "none", fontWeight: 600 }}>
                    Endgültig löschen
                  </button>
                  <button onClick={() => setConfirmingId(null)} className="mono text-[11px] px-3 py-1.5 rounded" style={{ background: "#38415A", color: "#9AA3B5", border: "none" }}>
                    Abbrechen
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div className="flex gap-2">
        <input
          value={newName}
          onChange={(e) => setNewName(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") submitNew(); }}
          placeholder="Neue Kategorie, z. B. Wartung"
          className="flex-1 text-sm rounded-lg px-2.5 py-2"
          style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}
        />
        <button type="button" onClick={submitNew} className="sg text-xs rounded-lg px-3 py-2" style={{ background: "#E8B54B", color: "#1B2130", fontWeight: 600, border: "none" }}>
          Anlegen
        </button>
      </div>
    </div>
  );
}

function LoginScreen({ onLogin, loading, error }) {
  const [localError, setLocalError] = useState(null);
  const emailRef = useRef(null);
  const passwordRef = useRef(null);

  function submit() {
    const email = (emailRef.current?.value || "").trim();
    const password = passwordRef.current?.value || "";
    if (!email || !password) {
      setLocalError("Bitte E-Mail-Adresse und Passwort eingeben.");
      return;
    }
    setLocalError(null);
    onLogin(email, password);
  }

  function handleKeyDown(e) {
    if (e.key === "Enter") submit();
  }

  return (
    <div style={{ background: "#1B2130", minHeight: "100vh", fontFamily: "Inter, sans-serif" }} className="flex items-center justify-center px-4">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        .sg { font-family: 'Space Grotesk', sans-serif; }
      `}</style>
      <div className="w-full max-w-xs rounded-2xl p-6" style={{ background: "#242C3E" }}>
        <h1 className="sg text-xl mb-1" style={{ color: "#EDEAE2", fontWeight: 600 }}>
          Kiba
        </h1>
        <p className="text-xs mb-5" style={{ color: "#6E7A94" }}>
          Anmelden, um auf deine Aufgaben zuzugreifen.
        </p>
        <input
          ref={emailRef}
          name="email"
          type="email"
          defaultValue=""
          placeholder="E-Mail-Adresse"
          className="w-full text-sm rounded-lg px-3 py-2.5 mb-2"
          style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}
          autoCapitalize="none"
          autoCorrect="off"
          autoComplete="username"
          onKeyDown={handleKeyDown}
        />
        <input
          ref={passwordRef}
          name="password"
          type="password"
          defaultValue=""
          placeholder="Passwort"
          className="w-full text-sm rounded-lg px-3 py-2.5 mb-3"
          style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2" }}
          autoComplete="current-password"
          onKeyDown={handleKeyDown}
        />
        {(localError || error) && (
          <p className="text-xs mb-3" style={{ color: "#E2704F" }}>
            {localError || error}
          </p>
        )}
        <button
          type="button"
          onClick={submit}
          disabled={loading}
          className="sg w-full text-sm rounded-lg py-2.5"
          style={{ background: loading ? "#38415A" : "#E8B54B", color: loading ? "#6E7A94" : "#1B2130", fontWeight: 600, border: "none" }}
        >
          {loading ? "Melde an …" : "Anmelden"}
        </button>
      </div>
    </div>
  );
}

function Wochenplaner() {
  const [auth, setAuth] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [authError, setAuthError] = useState(null);
  const [loggingIn, setLoggingIn] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const stored = localStorage.getItem("kiba-refresh-token");
        if (stored) {
          const data = await firebaseRefreshToken(stored);
          const idToken = data.id_token;
          setAuth({
            idToken,
            refreshToken: data.refresh_token,
            uid: data.user_id,
            email: decodeJwt(idToken).email || "",
            expiresAt: Date.now() + Number(data.expires_in) * 1000,
          });
        }
      } catch (e) {
        localStorage.removeItem("kiba-refresh-token");
      } finally {
        setAuthChecked(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!auth) return;
    const msUntilRefresh = Math.max(auth.expiresAt - Date.now() - 5 * 60 * 1000, 10000);
    const t = setTimeout(async () => {
      try {
        const data = await firebaseRefreshToken(auth.refreshToken);
        const idToken = data.id_token;
        setAuth({
          idToken,
          refreshToken: data.refresh_token,
          uid: data.user_id,
          email: decodeJwt(idToken).email || auth.email,
          expiresAt: Date.now() + Number(data.expires_in) * 1000,
        });
        localStorage.setItem("kiba-refresh-token", data.refresh_token);
      } catch (e) {
        // wird beim nächsten Firestore-Zugriff sichtbar
      }
    }, msUntilRefresh);
    return () => clearTimeout(t);
  }, [auth]);

  async function handleLogin(email, password) {
    setLoggingIn(true);
    setAuthError(null);
    try {
      const data = await firebaseSignIn(email, password);
      setAuth({
        idToken: data.idToken,
        refreshToken: data.refreshToken,
        uid: data.localId,
        email: data.email || email,
        expiresAt: Date.now() + Number(data.expiresIn) * 1000,
      });
      localStorage.setItem("kiba-refresh-token", data.refreshToken);
    } catch (e) {
      setAuthError(e.message || "Anmeldung fehlgeschlagen");
    } finally {
      setLoggingIn(false);
    }
  }

  function handleLogout() {
    setAuth(null);
    localStorage.removeItem("kiba-refresh-token");
  }

  if (!authChecked) {
    return (
      <div style={{ background: "#1B2130", minHeight: "100vh" }} className="flex items-center justify-center">
        <span style={{ color: "#9AA3B5", fontFamily: "Inter, sans-serif" }}>Lade …</span>
      </div>
    );
  }

  if (!auth) {
    return <LoginScreen onLogin={handleLogin} loading={loggingIn} error={authError} />;
  }

  return <WochenplanerApp auth={auth} onLogout={handleLogout} onAuthRefreshed={setAuth} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Wochenplaner />);

</script>
</body>
