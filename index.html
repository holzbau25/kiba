<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAanWAHmr3wboULjMZpGp_aiuFLsFw9YC4",
  projectId: "kiba-fa62c",
};

function firestoreDocUrl(uid) {
  return `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/users/${uid}/kiba/state`;
}

async function firebaseSignIn(email, password) {
  const res = await fetch(
    `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_CONFIG.apiKey}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password, returnSecureToken: true }),
    }
  );
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "Anmeldung fehlgeschlagen");
  return data;
}

async function firebaseRefreshToken(refreshToken) {
  const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FIREBASE_CONFIG.apiKey}`, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "Sitzung konnte nicht erneuert werden");
  return data;
}

async function firestoreGetState(idToken, uid) {
  const res = await fetch(firestoreDocUrl(uid), {
    headers: { Authorization: `Bearer ${idToken}` },
  });
  if (res.status === 404) return null;
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "Firestore-Fehler beim Laden");
  const f = data.fields || {};
  const parseField = (name) => {
    try {
      return f[name]?.stringValue ? JSON.parse(f[name].stringValue) : null;
    } catch (e) {
      return null;
    }
  };
  return {
    projects: parseField("projectsJson"),
    tasks: parseField("tasksJson"),
    inbox: parseField("inboxJson"),
    categories: parseField("categoriesJson"),
    voiceNotes: parseField("notesJson"),
  };
}

async function firestoreSetState(idToken, uid, state) {
  const body = {
    fields: {
      projectsJson: { stringValue: JSON.stringify(state.projects) },
      tasksJson: { stringValue: JSON.stringify(state.tasks) },
      inboxJson: { stringValue: JSON.stringify(state.inbox) },
      categoriesJson: { stringValue: JSON.stringify(state.categories) },
      notesJson: { stringValue: JSON.stringify(state.voiceNotes) },
      updatedAt: { stringValue: new Date().toISOString() },
    },
  };
  const res = await fetch(firestoreDocUrl(uid), {
    method: "PATCH",
    headers: { Authorization: `Bearer ${idToken}`, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "Firestore-Fehler beim Speichern");
  return data;
}

function decodeJwt(token) {
  try {
    const payload = token.split(".")[1];
    const json = decodeURIComponent(
      atob(payload.replace(/-/g, "+").replace(/_/g, "/"))
        .split("")
        .map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
        .join("")
    );
    return JSON.parse(json);
  } catch (e) {
    return {};
  }
}

const DEFAULT_CATEGORIES = [
  { id: "bauvorhaben", name: "Bauvorhaben", color: "#E8B54B", order: 0 },
  { id: "privat", name: "Privat", color: "#6FBF8B", order: 1 },
  { id: "betrieblich", name: "Betrieblich", color: "#7FA8E0", order: 2 },
];

const CATEGORY_COLOR_PALETTE = ["#E8B54B", "#6FBF8B", "#7FA8E0", "#E2704F", "#B08FD6", "#5FC7C2", "#D6C568"];

const TASK_TYPES = {
  allgemein: { label: "Allgemein", icon: "•" },
  telefonat: { label: "Anruf", icon: "📞" },
  email: { label: "E-Mail", icon: "✉️" },
  kalkulation: { label: "Kalkulation", icon: "🧮" },
  material: { label: "Material bestellen", icon: "📦" },
};

const DEFAULT_PROJECTS = [
  { id: "privat", name: "Privat", type: "privat", isArchived: false, order: 0 },
  { id: "betrieblich", name: "Betrieblich (allgemein)", type: "betrieblich", isArchived: false, order: 1 },
];

function activeProjects(projects, alsoInclude) {
  return projects.filter((p) => !p.isArchived || p.id === alsoInclude);
}

function stripRedundantTypeWord(name, categoryName) {
  if (!name) return name;
  if (!categoryName) return name.trim();
  const re = new RegExp("^" + categoryName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s+", "i");
  return name.trim().replace(re, "").trim() || name.trim();
}

function uid(prefix = "") {
  return prefix + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function todayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function fmtDeadline(iso) {
  if (!iso) return null;
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function priorityColor(p) {
  if (p >= 8) return "#E2704F";
  if (p >= 4) return "#E8B54B";
  return "#6E7A94";
}

function daysUntil(iso) {
  if (!iso) return null;
  const today = new Date(todayIso() + "T00:00:00");
  const target = new Date(iso + "T00:00:00");
  return Math.round((target - today) / 86400000);
}

const EFFORT_OPTIONS = Array.from({ length: 32 }, (_, i) => (i + 1) * 0.25);

function fmtEffort(hours) {
  if (!hours) return null;
  const h = Math.floor(hours);
  const m = Math.round((hours - h) * 60);
  if (h === 0) return `${m} Min`;
  if (m === 0) return `${h} Std`;
  return `${h} Std ${m} Min`;
}

function WochenplanerApp({ auth, onLogout, onAuthRefreshed }) {
  const [projects, setProjects] = useState(null);
  const [tasks, setTasks] = useState(null);
  const [inbox, setInbox] = useState(null);
  const [categories, setCategories] = useState(null);
  const [voiceNotes, setVoiceNotes] = useState(null);
  const [activeTab, setActiveTab] = useState("heute");
  const [filterProject, setFilterProject] = useState("alle");
  const [hideDone, setHideDone] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const loadedRef = useRef(false);
  const authRef = useRef(auth);
  authRef.current = auth;

  async function withAuthRetry(fn) {
    try {
      return await fn(authRef.current.idToken);
    } catch (e) {
      try {
        const data = await firebaseRefreshToken(authRef.current.refreshToken);
        const idToken = data.id_token;
        const refreshed = {
          idToken,
          refreshToken: data.refresh_token,
          uid: data.user_id,
          email: decodeJwt(idToken).email || authRef.current.email,
          expiresAt: Date.now() + Number(data.expires_in) * 1000,
        };
        authRef.current = refreshed;
        onAuthRefreshed(refreshed);
        return await fn(refreshed.idToken);
      } catch (e2) {
        throw e;
      }
    }
  }

  useEffect(() => {
    (async () => {
      try {
        const state = await withAuthRetry((token) => firestoreGetState(token, auth.uid));
        setProjects(state && state.projects ? state.projects : DEFAULT_PROJECTS);
        setTasks(state && state.tasks ? state.tasks : []);
        setInbox(state && state.inbox ? state.inbox : []);
        setCategories(state && state.categories ? state.categories : DEFAULT_CATEGORIES);
        setVoiceNotes(state && state.voiceNotes ? state.voiceNotes : []);
      } catch (e) {
        setSaveState("error");
        setSaveError("Laden fehlgeschlagen: " + (e.message || String(e)));
        setProjects(DEFAULT_PROJECTS);
        setTasks([]);
        setInbox([]);
        setCategories(DEFAULT_CATEGORIES);
        setVoiceNotes([]);
      } finally {
        loadedRef.current = true;
      }
    })();
  }, [auth.uid]);

  const saveChainRef = useRef(Promise.resolve());

  const [saveError, setSaveError] = useState(null);

  useEffect(() => {
    if (!loadedRef.current || projects === null || tasks === null || inbox === null || categories === null || voiceNotes === null) return;
    const snapshot = { projects, tasks, inbox, categories, voiceNotes };
    setSaveState("saving");
    saveChainRef.current = saveChainRef.current.then(async () => {
      try {
        await withAuthRetry((token) => firestoreSetState(token, auth.uid, snapshot));
        setSaveState("saved");
        setSaveError(null);
      } catch (e) {
        setSaveState("error");
        setSaveError(e.message || String(e));
      }
    });
  }, [projects, tasks, inbox, categories, voiceNotes]);

  const projectById = useMemo(() => {
    const m = {};
    (projects || []).forEach((p) => (m[p.id] = p));
    return m;
  }, [projects]);

  const categoryById = useMemo(() => {
    const m = {};
    (categories || []).forEach((c) => (m[c.id] = c));
    return m;
  }, [categories]);

  function createCategory(name) {
    const maxOrder = categories.reduce((m, c) => Math.max(m, c.order ?? 0), -1);
    const color = CATEGORY_COLOR_PALETTE[categories.length % CATEGORY_COLOR_PALETTE.length];
    const c = { id: uid("cat_"), name: name.trim(), color, order: maxOrder + 1 };
    setCategories((prev) => [...prev, c]);
    return c;
  }

  function renameCategory(id, name) {
    setCategories((prev) => prev.map((c) => (c.id === id ? { ...c, name: name.trim() } : c)));
  }

  function deleteCategory(id) {
    if (projects.some((p) => p.type === id)) return false;
    setCategories((prev) => prev.filter((c) => c.id !== id));
    return true;
  }

  function moveCategory(id, direction) {
    setCategories((prev) => {
      const sorted = [...prev].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      const idx = sorted.findIndex((c) => c.id === id);
      const swapIdx = direction === "up" ? idx - 1 : idx + 1;
      if (swapIdx < 0 || swapIdx >= sorted.length) return prev;
      const a = sorted[idx];
      const b = sorted[swapIdx];
      return prev.map((c) => {
        if (c.id === a.id) return { ...c, order: b.order ?? 0 };
        if (c.id === b.id) return { ...c, order: a.order ?? 0 };
        return c;
      });
    });
  }

  function importAllData(data) {
    if (data.projects) setProjects(data.projects);
    if (data.tasks) setTasks(data.tasks);
    if (data.inbox) setInbox(data.inbox);
    if (data.categories) setCategories(data.categories);
    if (data.voiceNotes) setVoiceNotes(data.voiceNotes);
  }

  function addVoiceNote(note) {
    setVoiceNotes((prev) => [{ id: uid("note_"), capturedAt: new Date().toISOString(), ...note }, ...prev]);
  }

  function updateVoiceNote(id, patch) {
    setVoiceNotes((prev) => prev.map((n) => (n.id === id ? { ...n, ...patch } : n)));
  }

  function deleteVoiceNote(id) {
    setVoiceNotes((prev) => prev.filter((n) => n.id !== id));
  }

  function createProject(name, type) {
    const maxOrder = projects.reduce((m, p) => Math.max(m, p.order ?? 0), 0);
    const p = { id: uid("proj_"), name: name.trim(), type, isArchived: false, order: maxOrder + 1 };
    setProjects((prev) => [...prev, p]);
    return p;
  }

  function deleteProject(id) {
    setProjects((prev) => {
      if (prev.length <= 1) return prev;
      const fallback = prev.find((p) => p.id !== id);
      if (fallback) {
        setTasks((prevTasks) => prevTasks.map((t) => (t.projectId === id ? { ...t, projectId: fallback.id } : t)));
      }
      return prev.filter((p) => p.id !== id);
    });
  }

  function updateProject(id, patch) {
    setProjects((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  }

  function archiveProject(id) {
    setProjects((prev) => prev.map((p) => (p.id === id ? { ...p, isArchived: true } : p)));
  }

  function unarchiveProject(id) {
    setProjects((prev) => prev.map((p) => (p.id === id ? { ...p, isArchived: false } : p)));
  }

  function moveProject(id, direction) {
    setProjects((prev) => {
      const proj = prev.find((p) => p.id === id);
      if (!proj) return prev;
      const siblings = prev.filter((p) => p.type === proj.type && !p.isArchived).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      const idx = siblings.findIndex((p) => p.id === id);
      const swapIdx = direction === "up" ? idx - 1 : idx + 1;
      if (swapIdx < 0 || swapIdx >= siblings.length) return prev;
      const other = siblings[swapIdx];
      return prev.map((p) => {
        if (p.id === proj.id) return { ...p, order: other.order ?? 0 };
        if (p.id === other.id) return { ...p, order: proj.order ?? 0 };
        return p;
      });
    });
  }

  function addTask(task) {
    setTasks((prev) => [...prev, { id: uid("task_"), done: false, notes: "", type: "allgemein", estimatedHours: null, ...task }]);
  }

  function updateTask(id, patch) {
    setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, ...patch } : t)));
  }

  function deleteTask(id) {
    setTasks((prev) => prev.filter((t) => t.id !== id));
  }

  function addToInbox(text) {
    setInbox((prev) => [...prev, { id: uid("inbox_"), text, capturedAt: new Date().toISOString() }]);
  }

  function removeFromInbox(ids) {
    const idSet = new Set(Array.isArray(ids) ? ids : [ids]);
    setInbox((prev) => prev.filter((i) => !idSet.has(i.id)));
  }

  const loading = projects === null || tasks === null || inbox === null || categories === null || voiceNotes === null;

  return (
    <div style={{ background: "#1B2130", minHeight: "100vh", fontFamily: "Inter, sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
        .sg { font-family: 'Space Grotesk', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        ::selection { background: #E8B54B55; }
        .fade-in { animation: fadeIn 0.18s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 #E2704F55; } 70% { box-shadow: 0 0 0 14px #E2704F00; } 100% { box-shadow: 0 0 0 0 #E2704F00; } }
        .mic-live { animation: pulseRing 1.4s ease-out infinite; }
        .scrollbar-thin::-webkit-scrollbar { height: 6px; width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #38415A; border-radius: 3px; }
        input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid #E8B54B; outline-offset: 1px; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
      `}</style>

      <div className="max-w-3xl mx-auto px-4 py-6 md:py-8">
        <div className="flex items-center justify-between mb-5">
          <div>
            <h1 className="sg text-2xl" style={{ color: "#EDEAE2", fontWeight: 600 }}>
              Wochenplaner
            </h1>
            <p className="mono text-[11px] mt-0.5" style={{ color: saveState === "error" ? "#E2704F" : "#6E7A94" }}>
              {loading ? "lädt …" : saveState === "saving" ? "speichert …" : saveState === "error" ? "Speichern fehlgeschlagen" : "gespeichert"}
            </p>
            {saveState === "error" && saveError && (
              <p className="mono text-[10px] mt-0.5" style={{ color: "#E2704F", maxWidth: 320 }}>
                {saveError}
              </p>
            )}
          </div>
          <div className="text-right flex-shrink-0">
            <p className="mono text-[10px] mb-1" style={{ color: "#4B5468" }}>
              {auth.email}
            </p>
            <button onClick={onLogout} className="mono text-[10px] px-2 py-1 rounded" style={{ background: "transparent", border: "1px solid #38415A", color: "#6E7A94" }}>
              Abmelden
            </button>
          </div>
        </div>

        <div className="flex gap-1 mb-6 items-center">
          <div className="flex gap-1 rounded-xl p-1 overflow-x-auto scrollbar-thin flex-1" style={{ background: "#242C3E" }}>
            {[
              { id: "heute", label: "Aktuell" },
              { id: "erfassen", label: "Diktieren", badge: inbox && inbox.length > 0 ? inbox.length : null },
              { id: "alle", label: "Alle Aufgaben" },
              { id: "notizen", label: "Sprachnotizen" },
              { id: "projekte", label: "Listen" },
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className="sg flex-1 text-sm rounded-lg py-2 transition-colors relative flex-shrink-0"
                style={{
                  background: activeTab === tab.id ? "#E8B54B" : "transparent",
                  color: activeTab === tab.id ? "#1B2130" : "#9AA3B5",
                  fontWeight: 600,
                  minWidth: 84,
                  padding: "0.5rem 0.75rem",
                }}
              >
                {tab.label}
                {tab.badge && (
                  <span
                    className="mono"
                    style={{
                      position: "absolute",
                      top: 2,
                      right: 8,
                      fontSize: 9,
                      background: "#E2704F",
                      color: "#EDEAE2",
                      borderRadius: 999,
                      padding: "1px 5px",
                    }}
                  >
                    {tab.badge}
                  </span>
                )}
              </button>
            ))}
          </div>
          <button
            onClick={() => setActiveTab("einstellungen")}
            className="flex-shrink-0 rounded-xl flex items-center justify-center"
            style={{
              width: 42,
              height: 42,
              background: activeTab === "einstellungen" ? "#E8B54B" : "#242C3E",
              border: "none",
              fontSize: 18,
            }}
            aria-label="Einstellungen"
          >
            ⚙
          </button>
        </div>

        {loading ? (
          <div style={{ color: "#6E7A94" }}>Lade …</div>
        ) : (
          <>
            {activeTab === "heute" && (
              <HeuteTab
                tasks={tasks}
                projectById={projectById}
                categoryById={categoryById}
                projects={projects}
                updateTask={updateTask}
                deleteTask={deleteTask}
              />
            )}
            {activeTab === "erfassen" && (
              <ErfassenTab
                projects={projects}
                categories={categories}
                createProject={createProject}
                addTask={addTask}
                inbox={inbox}
                addToInbox={addToInbox}
                removeFromInbox={removeFromInbox}
                addVoiceNote={addVoiceNote}
              />
            )}
            {activeTab === "notizen" && (
              <NotizenTab voiceNotes={voiceNotes} updateVoiceNote={updateVoiceNote} deleteVoiceNote={deleteVoiceNote} />
            )}
            {activeTab === "alle" && (
              <AlleAufgabenTab
                tasks={tasks}
                projects={projects}
                projectById={projectById}
                categoryById={categoryById}
                filterProject={filterProject}
                setFilterProject={setFilterProject}
                hideDone={hideDone}
                setHideDone={setHideDone}
                updateTask={updateTask}
                deleteTask={deleteTask}
                addTask={addTask}
              />
            )}
            {activeTab === "projekte" && (
              <ProjekteTab
                projects={projects}
                tasks={tasks}
                createProject={createProject}
                deleteProject={deleteProject}
                updateProject={updateProject}
                archiveProject={archiveProject}
                unarchiveProject={unarchiveProject}
                moveProject={moveProject}
                categories={categories}
                onOpenProject={(id) => {
                  setFilterProject(id);
                  setActiveTab("alle");
                }}
              />
            )}
            {activeTab === "einstellungen" && (
              <EinstellungenTab
                projects={projects}
                tasks={tasks}
                inbox={inbox}
                categories={categories}
                voiceNotes={voiceNotes}
                onImport={importAllData}
                createCategory={createCategory}
                renameCategory={renameCategory}
                deleteCategory={deleteCategory}
                moveCategory={moveCategory}
              />
            )}
          </>
        )}
      </div>
    </div>
  );
}

function EinstellungenTab({ projects, tasks, inbox, categories, voiceNotes, onImport, createCategory, renameCategory, deleteCategory, moveCategory }) {
  const sortedCategories = useMemo(() => categories.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0)), [categories]);
  return (
    <div className="fade-in flex flex-col gap-8">
      <div>
        <h2 className="sg text-lg mb-3" style={{ color: "#EDEAE2", fontWeight: 600 }}>
          Kategorien
        </h2>
        <CategoryManager categories={sortedCategories} projects={projects} createCategory={createCategory} renameCategory={renameCategory} deleteCategory={deleteCategory} moveCategory={moveCategory} />
      </div>
      <div>
        <h2 className="sg text-lg mb-3" style={{ color: "#EDEAE2", fontWeight: 600 }}>
          Daten
        </h2>
        <DatenTabContent projects={projects} tasks={tasks} inbox={inbox} categories={categories} voiceNotes={voiceNotes} onImport={onImport} />
      </div>
    </div>
  );
}

function DatenTabContent({ projects, tasks, inbox, categories, voiceNotes, onImport }) {
  const [importText, setImportText] = useState("");
  const [confirmingImport, setConfirmingImport] = useState(false);
  const [importError, setImportError] = useState(null);
  const [importSuccess, setImportSuccess] = useState(false);
  const exportRef = useRef(null);

  const exportJson = useMemo(
    () => JSON.stringify({ projects, tasks, inbox, categories, voiceNotes, exportedAt: new Date().toISOString() }, null, 2),
    [projects, tasks, inbox, categories, voiceNotes]
  );

  function selectAllExport() {
    if (exportRef.current) {
      exportRef.current.focus();
      exportRef.current.select();
    }
  }

  function tryImport() {
    setImportError(null);
    setImportSuccess(false);
    let parsed;
    try {
      parsed = JSON.parse(importText);
    } catch (e) {
      setImportError("Das ist kein gültiges gespeichertes Backup (JSON konnte nicht gelesen werden).");
      return;
    }
    if (!parsed || (!parsed.tasks && !parsed.projects && !parsed.categories)) {
      setImportError("In diesem Text wurden keine Aufgaben/Listen/Kategorien gefunden.");
      return;
    }
    setConfirmingImport(true);
  }

  function confirmImport() {
    let parsed;
    try {
      parsed = JSON.parse(importText);
    } catch (e) {
      setImportError("Das ist kein gültiges gespeichertes Backup.");
      setConfirmingImport(false);
      return;
    }
    onImport(parsed);
    setConfirmingImport(false);
    setImportSuccess(true);
    setImportText("");
  }

function getMondayDate(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}

function isoFromDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function HeuteTab({ tasks, projectById, categoryById, projects, updateTask, deleteTask }) {
  const today = todayIso();
  const [filter, setFilter] = useState("aktuell");
  const [hideDone, setHideDone] = useState(true);

  const overdueAll = useMemo(
    () =>
      tasks
        .filter((t) => !t.done && t.deadline && t.deadline < today)
        .sort((a, b) => (a.deadline === b.deadline ? b.priority - a.priority : a.deadline < b.deadline ? -1 : 1)),
    [tasks, today]
  );

  const dueTodayAll = useMemo(
    () => tasks.filter((t) => t.deadline === today).sort((a, b) => (a.done !== b.done ? (a.done ? 1 : -1) : b.priority - a.priority)),
    [tasks, today]
  );

  const doneToday = useMemo(() => tasks.filter((t) => t.done && t.deadline === today).length, [tasks, today]);

  const weekRanges = useMemo(() => {
    const monday = getMondayDate(new Date());
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    const nextMonday = new Date(monday);
    nextMonday.setDate(monday.getDate() + 7);
    const nextSunday = new Date(nextMonday);
    nextSunday.setDate(nextMonday.getDate() + 6);
    return {
      thisWeek: [isoFromDate(monday), isoFromDate(sunday)],
      nextWeek: [isoFromDate(nextMonday), isoFromDate(nextSunday)],
    };
  }, []);

  const thisWeekTasksAll = useMemo(() => {
    const [start, end] = weekRanges.thisWeek;
    return tasks
      .filter((t) => t.deadline && t.deadline >= start && t.deadline <= end)
      .sort((a, b) => (a.done !== b.done ? (a.done ? 1 : -1) : a.deadline !== b.deadline ? (a.deadline < b.deadline ? -1 : 1) : b.priority - a.priority));
  }, [tasks, weekRanges]);

  const nextWeekTasksAll = useMemo(() => {
    const [start, end] = weekRanges.nextWeek;
    return tasks
      .filter((t) => t.deadline && t.deadline >= start && t.deadline <= end)
      .sort((a, b) => (a.done !== b.done ? (a.done ? 1 : -1) : a.deadline !== b.deadline ? (a.deadline < b.deadline ? -1 : 1) : b.priority - a.priority));
  }, [tasks, weekRanges]);

  const applyHide = (list) => (hideDone ? list.filter((t) => !t.done) : list);

  const overdue = useMemo(() => applyHide(overdueAll), [overdueAll, hideDone]);
  const dueToday = useMemo(() => applyHide(dueTodayAll), [dueTodayAll, hideDone]);
  const thisWeekTasks = useMemo(() => applyHide(thisWeekTasksAll), [thisWeekTasksAll, hideDone]);
  const nextWeekTasks = useMemo(() => applyHide(nextWeekTasksAll), [nextWeekTasksAll, hideDone]);

  const totalHoursToday = useMemo(() => dueTodayAll.filter((t) => !t.done).reduce((sum, t) => sum + (t.estimatedHours || 0), 0), [dueTodayAll]);

  function summarize(list) {
    const open = list.filter((t) => !t.done);
    const hours = open.reduce((sum, t) => sum + (t.estimatedHours || 0), 0);
    return hours > 0 ? `${open.length} · ${fmtEffort(hours)}` : `${open.length}`;
  }

  const filters = [
    { id: "aktuell", label: "Aktuell", info: summarize([...overdueAll, ...dueTodayAll]) },
    { id: "heute", label: "Heute", info: summarize(dueTodayAll) },
    { id: "woche", label: "Laufende Woche", info: summarize(thisWeekTasksAll) },
    { id: "naechsteWoche", label: "Nächste Woche", info: summarize(nextWeekTasksAll) },
    { id: "ueberfaellig", label: "Überfällig", info: summarize(overdueAll) },
  ];

  function renderList(list, emptyText) {
    if (list.length === 0) {
      return (
        <div className="rounded-xl px-4 py-8 text-center text-sm" style={{ background: "#242C3E44", color: "#6E7A94", border: "1px dashed #38415A" }}>
          {emptyText}
        </div>
      );
    }
    return (
      <div className="flex flex-col gap-2">
        {list.map((t) => (
          <TaskRow
            key={t.id}
            task={t}
            project={projectById[t.projectId]}
            categoryById={categoryById}
            projects={projects}
            onToggle={() => updateTask(t.id, { done: !t.done })}
            onUpdate={(patch) => updateTask(t.id, patch)}
            onDelete={() => deleteTask(t.id)}
          />
        ))}
      </div>
    );
  }

  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-4">
        <div>
          <h2 className="sg text-lg" style={{ color: "#EDEAE2", fontWeight: 600 }}>
            {new Date().toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long" })}
          </h2>
          <p className="mono text-[11px] mt-0.5" style={{ color: "#6E7A94" }}>
            {dueTodayAll.length} heute fällig{totalHoursToday ? ` · ${fmtEffort(totalHoursToday)} geschätzt` : ""}
            {doneToday > 0 ? ` · ${doneToday} erledigt` : ""}
          </p>
        </div>
      </div>

      <label className="flex items-center gap-2 mono text-xs cursor-pointer mb-3" style={{ color: "#6E7A94" }}>
        <input type="checkbox" checked={hideDone} onChange={(e) => setHideDone(e.target.checked)} style={{ accentColor: "#E8B54B" }} />
        Erledigte ausblenden
      </label>

      <div className="flex flex-wrap gap-1.5 mb-5">
        {filters.map((f) => (
          <button
            key={f.id}
            onClick={() => setFilter(f.id)}
            className="mono text-xs rounded-lg px-3 py-1.5"
            style={{
              background: filter === f.id ? "#E8B54B" : "#242C3E",
              color: filter === f.id ? "#1B2130" : "#9AA3B5",
              border: "none",
              fontWeight: filter === f.id ? 600 : 400,
            }}
          >
            {f.label} ({f.info})
          </button>
        ))}
      </div>

      {filter === "aktuell" && (
        <>
          {overdue.length > 0 && (
            <div className="mb-5">
              <h3 className="mono text-[11px] uppercase tracking-wide mb-2" style={{ color: "#E2704F" }}>
                Überfällig ({overdue.length})
              </h3>
              {renderList(overdue, "Keine überfälligen Aufgaben.")}
            </div>
          )}
          <div>
            <h3 className="mono text-[11px] uppercase tracking-wide mb-2" style={{ color: "#6E7A94" }}>
              Heute
            </h3>
            {renderList(dueToday, "Für heute nichts Fälliges eingetragen.")}
          </div>
        </>
      )}

      {filter === "heute" && renderList(dueToday, "Für heute nichts Fälliges eingetragen.")}
      {filter === "ueberfaellig" && renderList(overdue, "Keine überfälligen Aufgaben.")}
      {filter === "woche" && renderList(thisWeekTasks, "Für diese Woche nichts eingetragen.")}
      {filter === "naechsteWoche" && renderList(nextWeekTasks, "Für nächste Woche nichts eingetragen.")}
    </div>
  );
}

function ErfassenTab({ projects, categories, createProject, addTask, inbox, addToInbox, removeFromInbox, addVoiceNote }) {
  const [transcript, setTranscript] = useState("");
  const [isListening, setIsListening] = useState(false);
  const [speechSupported, setSpeechSupported] = useState(false);
  const [isProcessing, setIsProcessing] = useState(false);
  const [processingInboxId, setProcessingInboxId] = useState(null);
  const [suggestions, setSuggestions] = useState([]);
  const [noteSuggestions, setNoteSuggestions] = useState([]);
  const [sourceTexts, setSourceTexts] = useState([]);
  const [aiError, setAiError] = useState(null);
  const [confirmingInboxId, setConfirmingInboxId] = useState(null);
  const recognitionRef = useRef(null);
  const textareaRef = useRef(null);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    setSpeechSupported(!!SR);
  }, []);

  useEffect(() => {
    if (suggestions.length === 0 && noteSuggestions.length === 0) setSourceTexts([]);
  }, [suggestions, noteSuggestions]);

  function toggleListening() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      textareaRef.current && textareaRef.current.focus();
      return;
    }
    if (isListening) {
      recognitionRef.current && recognitionRef.current.stop();
      setIsListening(false);
      return;
    }
    const recognition = new SR();
    recognition.lang = "de-DE";
    recognition.continuous = true;
    recognition.interimResults = true;
    let base = transcript ? transcript + " " : "";
    recognition.onresult = (event) => {
      let interim = "";
      let finalChunk = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalChunk += t + " ";
        else interim += t;
      }
      if (finalChunk) base += finalChunk;
      setTranscript((base + interim).trim());
    };
    recognition.onerror = () => setIsListening(false);
    recognition.onend = () => setIsListening(false);
    recognitionRef.current = recognition;
    recognition.start();
    setIsListening(true);
  }

  async function extractSuggestions(text) {
    const catList = categories.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    const projectList = activeProjects(projects)
      .map((p) => `- ${p.name} (${catList.find((c) => c.id === p.type)?.name || p.type})`)
      .join("\n");
    const categoryNameList = catList.map((c) => `- ${c.name}`).join("\n");
    const taskTypeList = Object.entries(TASK_TYPES).map(([id, meta]) => `- ${id}: ${meta.label}`).join("\n");
    const systemPrompt = `Du verarbeitest diktierten deutschen Text für den Handwerksbetrieb (Zimmerei) eines Nutzers. Heutiges Datum: ${todayIso()}.
Bestehende Listen:
${projectList}

Verfügbare Kategorien für Listen:
${categoryNameList}

Verfügbare Aufgabentypen:
${taskTypeList}

Der Text kann mehrere, thematisch unterschiedliche Elemente aus verschiedenen Momenten des Tages enthalten. Für jedes Element entscheidest du zuerst, ob es sich um eine AUFGABE (etwas Konkretes, das erledigt werden muss) oder eine NOTIZ (eine Gedächtnisstütze/Protokoll ohne direkten Handlungsauftrag, z. B. Zusammenfassung eines Telefonats, einer Baubesprechung, einer Beobachtung oder Information zum Nachschlagen) handelt.

Gib AUSSCHLIESSLICH ein valides JSON-Array zurück, ohne Markdown-Codeblock, ohne Fließtext davor oder danach. Jedes Objekt braucht ein Feld "kind" mit dem Wert "aufgabe" oder "notiz".

Für kind="aufgabe" zusätzlich exakt diese Felder:
- title: kurzer, prägnanter Titel (max. ca. 8 Wörter)
- notes: Langtext mit Details, oder leerer String falls nichts Zusätzliches genannt wurde
- priority: Ganzzahl von 1 (niedrig) bis 10 (sehr hoch), schätze sinnvoll falls nicht explizit genannt (Standard 5)
- estimatedHours: geschätzter Zeitaufwand in Stunden als Dezimalzahl gerundet auf Viertelstunden (z. B. 0.25, 0.5, 1.5, 2), nur falls im Text ein Zeitaufwand genannt oder klar erkennbar ist, sonst null
- deadline: Datum im Format YYYY-MM-DD, löse relative Angaben wie "nächsten Freitag" oder "in zwei Wochen" anhand des heutigen Datums auf, sonst null
- projectName: exakter Name einer der oben gelisteten bestehenden Listen, falls der Text klar dazu passt, sonst null
- categoryName: exakter Name einer der oben gelisteten Kategorien, deine beste Einschätzung
- suggestedNewProjectName: falls es klingt, als gehöre die Aufgabe zu einer neuen Liste (z. B. neues Bauvorhaben), die noch nicht existiert, deren Name, sonst null. Nenne hier NUR den unterscheidenden Namen (z. B. den Bauherren- oder Objektnamen wie "Schwarz" oder "Familie Müller") — wiederhole NICHT den Kategorienamen (z. B. nicht "Bauvorhaben"), da die Kategorie separat als categoryName angezeigt wird.
- taskType: eine der ID aus der Liste der Aufgabentypen oben, die am besten passt (Standard "allgemein")

Für kind="notiz" NUR diese Felder (keine der Aufgaben-Felder):
- title: kurzer, prägnanter Titel (max. ca. 8 Wörter)
- content: die vollständige, gut lesbare, in ordentlichen Sätzen aufbereitete Version des gesprochenen Inhalts. Fasse zusammen, räume Füllwörter und Versprecher auf, aber lass keine inhaltliche Information weg.

Wenn der Text mehrere Elemente enthält, gib mehrere Objekte zurück.`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        system: systemPrompt,
        messages: [{ role: "user", content: text }],
      }),
    });
    if (!response.ok) {
      const errBody = await response.text().catch(() => "");
      throw new Error(`API-Fehler ${response.status}: ${errBody.slice(0, 200)}`);
    }
    const data = await response.json();
    if (data.type === "error") {
      throw new Error(data.error?.message || "Unbekannter API-Fehler");
    }
    const respText = (data.content || []).map((c) => c.text || "").join("\n");
    const clean = respText.replace(/```json|```/g, "").trim();
    let parsed;
    try {
      parsed = JSON.parse(clean);
    } catch (e) {
      throw new Error("Antwort konnte nicht gelesen werden: " + clean.slice(0, 150));
    }
    const arr = Array.isArray(parsed) ? parsed : [parsed];

    const taskItems = arr.filter((item) => item.kind !== "notiz");
    const noteItems = arr.filter((item) => item.kind === "notiz");

    const tasksBuilt = taskItems.map((item) => {
      let resolvedProjectId = null;
      let isNewProject = false;
      let newProjectName = null;
      const matchedCategory = catList.find((c) => c.name.toLowerCase() === String(item.categoryName || "").toLowerCase());
      const resolvedCategoryId = matchedCategory ? matchedCategory.id : catList[0]?.id;
      if (item.projectName) {
        const match = projects.find((p) => p.name.toLowerCase() === String(item.projectName).toLowerCase());
        if (match) resolvedProjectId = match.id;
      }
      if (!resolvedProjectId && item.suggestedNewProjectName) {
        isNewProject = true;
        newProjectName = stripRedundantTypeWord(item.suggestedNewProjectName, matchedCategory?.name);
      }
      if (!resolvedProjectId && !isNewProject) {
        const sameCategoryProject = activeProjects(projects).find((p) => p.type === resolvedCategoryId);
        resolvedProjectId = sameCategoryProject ? sameCategoryProject.id : activeProjects(projects)[0]?.id || projects[0]?.id;
      }
      return {
        tempId: uid("sug_"),
        title: item.title || "Ohne Titel",
        notes: item.notes || "",
        priority: Math.min(10, Math.max(1, parseInt(item.priority, 10) || 5)),
        estimatedHours: item.estimatedHours ? Math.round(parseFloat(item.estimatedHours) * 4) / 4 : null,
        deadline: item.deadline || "",
        projectId: resolvedProjectId,
        isNewProject,
        newProjectName,
        newProjectType: resolvedCategoryId || catList[0]?.id,
        taskType: TASK_TYPES[item.taskType] ? item.taskType : "allgemein",
      };
    });

    const notesBuilt = noteItems.map((item) => ({
      tempId: uid("notesug_"),
      title: item.title || "Sprachnotiz",
      content: item.content || "",
    }));

    return { tasks: tasksBuilt, notes: notesBuilt };
  }

  async function extractSuggestionsWithRetry(text) {
    const delays = [500, 1200];
    let lastError;
    try {
      return await extractSuggestions(text);
    } catch (e) {
      lastError = e;
    }
    for (const delay of delays) {
      await new Promise((resolve) => setTimeout(resolve, delay));
      try {
        return await extractSuggestions(text);
      } catch (e) {
        lastError = e;
      }
    }
    throw lastError;
  }

  async function processTranscript() {
    if (!transcript.trim()) return;
    setIsProcessing(true);
    setAiError(null);
    try {
      const built = await extractSuggestionsWithRetry(transcript);
      setSourceTexts((prev) => [...prev, transcript.trim()]);
      setSuggestions((prev) => [...prev, ...built.tasks]);
      setNoteSuggestions((prev) => [...prev, ...built.notes]);
      setTranscript("");
    } catch (e) {
      setAiError("Verarbeitung fehlgeschlagen: " + (e.message || "unbekannter Fehler"));
    } finally {
      setIsProcessing(false);
    }
  }

  function saveForLater() {
    if (!transcript.trim()) return;
    addToInbox(transcript.trim());
    setTranscript("");
  }

  async function processInboxItem(item) {
    setProcessingInboxId(item.id);
    setAiError(null);
    try {
      const built = await extractSuggestionsWithRetry(item.text);
      setSourceTexts((prev) => [...prev, item.text]);
      setSuggestions((prev) => [...prev, ...built.tasks]);
      setNoteSuggestions((prev) => [...prev, ...built.notes]);
      removeFromInbox(item.id);
    } catch (e) {
      setAiError("Verarbeitung fehlgeschlagen: " + (e.message || "unbekannter Fehler"));
    } finally {
      setProcessingInboxId(null);
    }
  }

  async function processAllInbox() {
    if (!inbox.length) return;
    setIsProcessing(true);
    setAiError(null);
    try {
      const combined = inbox.map((i) => i.text).join("\n---\n");
      const built = await extractSuggestionsWithRetry(combined);
      setSourceTexts((prev) => [...prev, ...inbox.map((i) => i.text)]);
      setSuggestions((prev) => [...prev, ...built.tasks]);
      setNoteSuggestions((prev) => [...prev, ...built.notes]);
      removeFromInbox(inbox.map((i) => i.id));
    } catch (e) {
      setAiError("Verarbeitung fehlgeschlagen: " + (e.message || "unbekannter Fehler"));
    } finally {
      setIsProcessing(false);
    }
  }

  function updateSuggestion(tempId, patch) {
    setSuggestions((prev) => prev.map((s) => (s.tempId === tempId ? { ...s, ...patch } : s)));
  }

  function discardSuggestion(tempId) {
    setSuggestions((prev) => prev.filter((s) => s.tempId !== tempId));
  }

  function confirmSuggestion(s) {
    let projectId = s.projectId;
    if (s.isNewProject && s.newProjectName) {
      const p = createProject(s.newProjectName, s.newProjectType);
      projectId = p.id;
    }
    addTask({
      title: s.title,
      notes: s.notes,
      priority: s.priority,
      estimatedHours: s.estimatedHours || null,
      deadline: s.deadline || null,
      projectId,
      type: s.taskType || "allgemein",
    });
    discardSuggestion(s.tempId);
  }

  function confirmAll() {
    suggestions.forEach((s) => confirmSuggestion(s));
  }

  function updateNoteSuggestion(tempId, patch) {
    setNoteSuggestions((prev) => prev.map((s) => (s.tempId === tempId ? { ...s, ...patch } : s)));
  }

  function discardNoteSuggestion(tempId) {
    setNoteSuggestions((prev) => prev.filter((s) => s.tempId !== tempId));
  }

  function confirmNoteSuggestion(s) {
    addVoiceNote({ title: s.title, content: s.content });
    discardNoteSuggestion(s.tempId);
  }

  function confirmAllNotes() {
    noteSuggestions.forEach((s) => confirmNoteSuggestion(s));
  }

  function fmtCapturedTime(iso) {
    const d = new Date(iso);
    return d.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  return (
    <div className="fade-in">
      <div className="rounded-xl p-4 mb-4" style={{ background: "#242C3E" }}>
        <div className="flex items-center gap-3 mb-3">
          <button
            onClick={toggleListening}
            className={isListening ? "mic-live" : ""}
            style={{
              width: 52,
              height: 52,
              borderRadius: "50%",
              background: isListening ? "#E2704F" : "#E8B54B",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              flexShrink: 0,
              border: "none",
            }}
            aria-label="Diktat starten oder stoppen"
          >
            <span style={{ fontSize: 20 }}>{isListening ? "■" : "🎤"}</span>
          </button>
          <div>
            <p className="sg text-sm" style={{ color: "#EDEAE2", fontWeight: 600 }}>
              {isListening ? "Höre zu …" : "Aufgaben diktieren"}
            </p>
            <p className="mono text-[11px]" style={{ color: "#6E7A94" }}>
              {speechSupported
                ? "Sprich Titel, Deadline, Priorität, Liste einfach so, wie sie dir einfallen."
                : "Live-Diktat hier nicht verfügbar – tippe unten ins Feld und nutze das Mikrofon deiner Tastatur."}
            </p>
          </div>
        </div>
        <textarea
          ref={textareaRef}
          value={transcript}
          onChange={(e) => setTranscript(e.target.value)}
          placeholder="z. B. „Für das Bauvorhaben Müller die Dachlatten bestellen, bis Freitag, ziemlich dringend“"
          rows={4}
          className="w-full rounded-lg px-3 py-2.5 text-sm"
          style={{ background: "#1B2130", border: "1px solid #38415A", color: "#EDEAE2", resize: "vertical" }}
        />
        <div className="flex justify-end gap-2 mt-2">
          <button
            onClick={saveForLater}
            disabled={!transcript.trim()}
            className="mono text-xs rounded-lg px-3 py-2"
            style={{
              background: "transparent",
              border: `1px solid ${transcript.trim() ? "#6E7A94" : "#38415A"}`,
              color: transcript.trim() ? "#9AA3B5" : "#4B5468",
            }}
          >
            Für später speichern
          </button>
          <button
            onClick={processTranscript}
            disabled={!transcript.trim() || isProcessing}
            className="sg text-sm rounded-lg px-4 py-2"
            style={{
              background: !transcript.trim() || isProcessing ? "#38415A" : "#E8B54B",
              color: !transcript.trim() || isProcessing ? "#6E7A94" : "#1B2130",
              fontWeight: 600,
              border: "none",
            }}
          >
            {isProcessing ? "Verarbeite …" : "Jetzt verarbeiten"}
          </button>
        </div>
        {aiError && (
          <p className="mono text-xs mt-2" style={{ color: "#E2704F" }}>
            {aiError}
          </p>
        )}
      </div>

      {inbox.length > 0 && (
        <div className="rounded-xl p-4 mb-4 fade-in" style={{ background: "#242C3E", border: "1px solid #38415A" }}>
          <div className="flex items-center justify-between mb-2">
            <h3 className="sg text-sm" style={{ color: "#EDEAE2", fontWeight: 600 }}>
              Eingang ({inbox.length})
            </h3>
            <button
              onClick={processAllInbox}
              disabled={isProcessing}
              className="sg text-xs rounded-lg px-3 py-1.5"
              style={{ background: "#E8B54B", color: "#1B2130", fontWeight: 600, border: "none" }}
            >
              Alle verarbeiten
            </button>
          </div>
          <p className="mono text-[11px] mb-3" style={{ color: "#6E7A94" }}>
            Noch nicht durch die KI sortiert – bleibt sicher hier, bis du Zeit hast.
          </p>
          <div className="flex flex-col gap-2">
            {inbox.map((item) => (
              <div key={item.id} className="rounded-lg px-3 py-2.5" style={{ background: "#1B2130" }}>
                <div className="flex items-start justify-between gap-2">
                  <div className="flex-1 min-w-0">
                    <p className="mono text-[10px] mb-1" style={{ color: "#4B5468" }}>
                      {fmtCapturedTime(item.capturedAt)}
                    </p>
                    <p className="text-xs" style={{ color: "#EDEAE2" }}>
                      {item.text}
                    </p>
                  </div>
                  <div className="flex flex-col gap-1 flex-shrink-0">
                    <button
                      onClick={() => processInboxItem(item)}
                      disabled={processingInboxId === item.id}
                      className="mono text-[10px] px-2 py-1 rounded"
                      style={{ background: "#38415A", color: "#EDEAE2", border: "none" }}
                    >
                      {processingInboxId === item.id ? "…" : "Verarbeiten"}
                    </button>
                    {confirmingInboxId !== item.id ? (
                      <button
                        onClick={() => setConfirmingInboxId(item.id)}
                        className="mono text-[10px] px-2 py-1 rounded"
                        style={{ background: "transparent", color: "#4B5468", border: "none" }}
                      >
                        ✕
                      </button>
                    ) : (
                      <button
                        onClick={() => { removeFromInbox(item.id); setConfirmingInboxId(null); }}
                        className="mono text-[10px] px-2 py-1 rounded"
                        style={{ background: "#E2704F", color: "#1B2130", border: "none", fontWeight: 600 }}
                      >
                        Löschen?
                      </button>
                    )}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {(suggestions.length > 0 || noteSuggestions.length > 0) && (
        <div className="fade-in">
          {sourceTexts.length > 0 && (
            <div className="rounded-xl p-3 mb-3" style={{ background: "#1B2130", border: "1px dashed #38415A" }}>
              <p className="mono text-[10px] uppercase tracking-wide mb-1.5" style={{ color: "#6E7A94" }}>
                Diktiert
              </p>
              {sourceTexts.map((t, i) => (
                <p key={i} className="text-xs mb-1.5 last:mb-0" style={{ color: "#9AA3B5" }}>
                  {t}
                </p>
              ))}
            </div>
          )}

          {suggestions.length > 0 && (
            <div className="mb-5">
              <div className="flex items-center justify-between mb-2">
                <h3 className="sg text-sm" style={{ color: "#EDEAE2", fontWeight: 600 }}>
                  Aufgaben-Vorschläge ({suggestions.length})
                </h3>
                <button onClick={confirmAll} className="sg text-xs rounded-lg px-3 py-1.5" style={{ background: "#6FBF8B", color: "#1B2130", fontWeight: 600, border: "none" }}>
                  Alle anlegen
                </button>
              </div>
              <div className="flex flex-col gap-3">
                {suggestions.map((s) => (
                  <SuggestionCard
                    key={s.tempId}
                    s={s}
                    projects={projects}
                    categories={categories}
                    onChange={(patch) => updateSuggestion(s.tempId, patch)}
                    onConfirm={() => confirmSuggestion(s)}
                    onDiscard={() => discardSuggestion(s.tempId)}
                  />
                ))}
              </div>
            </div>
          )}

          {noteSuggestions.length > 0 && (
            <div>
              <div className="flex items-center justify-between mb-2">
                <h3 className="sg text-sm" style={{ color: "#EDEAE2", fontWeight: 600 }}>
                  Notiz-Vorschläge ({noteSuggestions.length})
                </h3>
                <button onClick={confirmAllNotes} className="sg text-xs rounded-lg px-3 py-1.5" style={{ background: "#7FA8E0", color: "#1B2130", fontWeight: 600, border: "none" }}>
                  Alle anlegen
                </button>
              </div>
              <div className="flex flex-col gap-3">
                {noteSuggestions.map((s) => (
                  <NoteSuggestionCard
                    key={s.tempId}
                    s={s}
                    onChange={(patch) => updateNoteSuggestion(s.tempId, patch)}
                    onConfirm={() => confirmNoteSuggestion(s)}
                    onDiscard={() => discardNoteSuggestion(s.tempId)}
                  />
                ))}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}
